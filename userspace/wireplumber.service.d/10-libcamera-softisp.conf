[Service]
# The process that actually runs libcamera for the camera portal is
# wireplumber, not pipewire -- the "Debayer processed ..." lines come from
# wireplumber[PID]. A drop-in on pipewire.service alone therefore changes
# nothing the camera app sees.
#
# /etc/environment.d is not enough either: the systemd user manager reads it
# when it starts, so editing it does not reach an already-running wireplumber,
# and the value only changes after the next login or reboot. This makes the
# setting take effect on `systemctl --user restart wireplumber`.
#
# Install as /etc/systemd/user/wireplumber.service.d/10-libcamera-softisp.conf
Environment=LIBCAMERA_SOFTISP_MODE=gpu
