# SPDX-License-Identifier: CC0-1.0
#
# Tuning for the Sony IMX132, the front camera of the Xperia Z2.
#
# **There is deliberately no Ccm here.** Copying imx363's matrices, which is
# what libcamera's own imx371.yaml does, was tried on 2026-09-21 and made the
# picture measurably worse: it roughly tripled the magenta cast in the
# shadows. Measured as the 1st-percentile gap between channels on one scene,
# same frame count, same light:
#
#     imx363 matrices     R-G +31   B-G +23
#     no Ccm              R-G +11   B-G  +8
#
# Borrowing a colour matrix from a different sensor is a guess about spectral
# response, and this guess was wrong. Leave it out until there is a measured
# one; the prior art for that is libchromatix_imx132_*.so on the stock system
# partition. See ../../docs/todo.md.
#
# What this file is still for is the black level, which is worth stating
# explicitly rather than letting the automatic estimator find it.
#
# blackLevel 4096 is the standard Sony 10-bit pedestal of 64 scaled to 16
# bits, and is what imx355, imx363 and imx371 all use. It is also what this
# sensor's own SMIA data_pedestal register (0x0008) reads, checked over CCI,
# and setting it explicitly measures the same as letting the estimator run --
# so it is right, and it is not the cause of the washed-out look.
#

# Install as /usr/share/libcamera/ipa/simple/imx132.yaml
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Adjust:
  - Agc:
...
