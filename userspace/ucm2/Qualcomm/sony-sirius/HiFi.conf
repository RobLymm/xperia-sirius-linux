# Use case configuration for the Sony Xperia Z2 (sirius).
#
# Playback path: ADSP (q6asm MultiMedia1) -> q6routing -> Quaternary MI2S ->
# two NXP TFA9890 smart amplifiers on i2c-1 at 0x34 (top) and 0x35 (bottom).
# The amplifiers are mono parts; each is told which half of the stereo stream
# to take, so the channel assignment is a verb-level setting rather than part
# of enabling the device.
#
# The headphone jack is deliberately not a device here. It works, but it is
# reached through the same PCM with a different set of routing controls, and
# PulseAudio turns two UCM devices that share a PCM into two card profiles
# rather than two ports. Switching profile tears the sink down, and the
# profile it switches to fails to open unless the hardware already happens to
# be in the right state, so the card drops to a null sink. Until that is
# solved the headphone route is switched by the application that wants it.

SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"

		cset "name='Speaker Top Amp Input' Left"
		cset "name='Speaker Bottom Amp Input' Right"
	]

	DisableSequence [
		cdev "hw:${CardId}"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in stereo speakers"

	EnableSequence [
		cdev "hw:${CardId}"

		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cdev "hw:${CardId}"

		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
