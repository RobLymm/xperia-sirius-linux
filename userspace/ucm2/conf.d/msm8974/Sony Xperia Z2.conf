# UCM profile for the Sony Xperia Z2 (sirius), msm8974 sound card.
#
# Found by the card's driver name, which the machine driver fixes to
# "msm8974" so that this path does not depend on the board's model string.

Syntax 6

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Play audio through the built-in speakers"
}
