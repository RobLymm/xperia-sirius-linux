# HiFi verb: MultiMedia1 front end routed to the Quaternary MI2S back end,
# which feeds the two TFA9890 amplifiers.
#
# The routing mixer is the one thing that must be set for sound to leave the
# DSP. Without it the PCM opens, accepts data and plays silence, which is the
# state the card is in with no UCM profile installed.

SectionVerb {
	EnableSequence [
		cdev "hw:${CardId}"

		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cdev "hw:${CardId}"

		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal stereo speakers"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority "100"
	}

	EnableSequence [
		cdev "hw:${CardId}"
	]

	DisableSequence [
		cdev "hw:${CardId}"
	]
}
