# libcamera's software ISP defaults to an EGL debayer on the GPU, which fails
# every frame on this phone's Adreno 330:
#
#     ERROR Debayer debayer_egl.cpp:669 debayerGPU failed
#
# The CPU path works. Applications get it from here rather than having to know.
# Install as /etc/environment.d/90-libcamera-softisp.conf.
#
# Probably the same underlying problem as /etc/sirius-renderer needing cairo
# rather than gl; see ../docs/known-problems.md.
LIBCAMERA_SOFTISP_MODE=cpu
