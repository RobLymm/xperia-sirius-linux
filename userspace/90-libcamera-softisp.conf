# libcamera's software ISP debayers either on the GPU (its default) or on the
# CPU. Use the GPU: on this phone it is the difference between the sensor's
# full frame rate and a quarter of it.
#
# Measured 2026-09-20 on the IOMMU kernel, front IMX132, 1976x1144 SBGGR10:
#
#     cpu   30 frames   13.3 fps
#     gpu   30 frames   47.3 fps
#     gpu  300 frames   56.8 fps sustained, 0 GPU faults, 0 hangchecks
#
# This file used to force the CPU path, because the GPU debayer failed every
# frame with "ERROR Debayer debayer_egl.cpp:669 debayerGPU failed" while the
# Adreno 330 could not run applications at all. It can now, and the GPU path
# works. One benign message remains, "Importing input DMABuf failed, falling
# back to upload": the frame is copied in rather than imported, and it is
# still nearly four times faster than the CPU.
#
# Install as /etc/environment.d/90-libcamera-softisp.conf.
LIBCAMERA_SOFTISP_MODE=gpu
