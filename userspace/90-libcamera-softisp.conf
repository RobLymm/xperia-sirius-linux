# libcamera's software ISP debayers either on the GPU (its default) or on the
# CPU. Which to use depends on whether the compositor is also on the GPU,
# because this Adreno stalls when two processes use it at once.
#
# The GPU debayer is genuinely much faster when the GPU is healthy -- measured
# in the camera app itself, which is the only measurement that counts:
#
#     cpu   244209 us/frame    4.1 fps
#     gpu    19647 us/frame   50.9 fps
#
# Those come from libcamera's own "Debayer processed 30 frames in ..." line,
# which it logs at INFO from whichever process is running the pipeline. Read
# it with:
#
#     journalctl --user -n 300 | grep "Debayer processed"
#
# Do not benchmark this with `cam` alone. `cam` on an idle GPU flatters the
# GPU path (56 fps against 8-14), and hammering the GPU with a synthetic load
# flatters the CPU path (9.7 against 10.9). Neither resembles the app, where
# the compositor draws a preview and the CPU has the rest of the session to
# run. The app is 12x faster on the GPU.
#
# With the compositor moved to its software renderer the GPU is free and the
# camera can have it, measured 2026-09-21:
#
#     compositor pixman, debayer cpu    298463 us/frame     3.4 fps
#     compositor pixman, debayer gpu     18241 us/frame    54.8 fps, 0 faults
#
# **Set this to cpu if the compositor is on the GPU.** That pairing is what
# stalls: 596 faults and six compositor crashes in one boot, after which the
# session dies. See phosh/software-compositor.md for the whole table.
#
# The history is that the GPU path used to fail outright, every frame, with
# "ERROR Debayer debayer_egl.cpp:669 debayerGPU failed", while the Adreno 330
# could not run applications at all. It no longer fails. One benign message
# remains, "Importing input DMABuf failed, falling back to upload".
#
# Install as /etc/environment.d/90-libcamera-softisp.conf, and install the
# wireplumber drop-in next to it -- see wireplumber.service.d/ for why.
LIBCAMERA_SOFTISP_MODE=gpu
