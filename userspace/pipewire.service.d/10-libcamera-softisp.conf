[Service]
# libcamera runs inside pipewire for the camera portal. /etc/environment.d is
# not enough: the user manager reads it at start, so a file written later never
# reaches an already-running pipewire. Install as
# /etc/systemd/user/pipewire.service.d/10-libcamera-softisp.conf
#
# See ../90-libcamera-softisp.conf for why this is gpu rather than cpu.
Environment=LIBCAMERA_SOFTISP_MODE=gpu
