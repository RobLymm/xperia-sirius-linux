[Service]
# libcamera runs inside pipewire for the camera portal, and its default EGL
# debayer fails every frame on this phone. /etc/environment.d is not enough:
# the user manager reads it at start, so a file written later never reaches an
# already-running pipewire. Install as
# /etc/systemd/user/pipewire.service.d/10-libcamera-softisp.conf
Environment=LIBCAMERA_SOFTISP_MODE=cpu
