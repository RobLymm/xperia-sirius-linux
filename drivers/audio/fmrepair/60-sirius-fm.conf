# Sony Xperia Z2: FM radio capture with the periodic I2S burst corruption
# repaired (see pcm_fmrepair.c). DEV is the MultiMedia2 capture PCM number,
# which follows the sound card's link order in the device tree (3 on the FM
# tree); CARD is the sound card index.
#
#   arecord -D sirius_fm -f S16_LE -r 48000 -c 2 -t raw ...
#   arecord -D sirius_fm:DEV=3 ...
pcm.sirius_fm {
	@args [ CARD DEV ]
	@args.CARD { type integer default 0 }
	@args.DEV { type integer default 3 }
	type fmrepair
	slave.pcm {
		type hw
		card $CARD
		device $DEV
	}
	hint {
		show on
		description "Sony Xperia Z2 FM radio (burst-repaired capture)"
	}
}
